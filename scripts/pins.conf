# Pin an app to a specific upstream release instead of "latest": <slug>=<tag>
# Every pin needs a reason and an exit condition. Reassess each pin on every update.
#
# DeckCraft 0.8.0's web build panics at startup ("no pids on this platform"), so Slides
# never loads. Upstream: https://github.com/storytold/deckcraft/issues/959 (fix PRs #977, #982).
# Remove this pin once a release newer than 0.8.0 ships with the fix and is verified.
slides=v0.7.0
